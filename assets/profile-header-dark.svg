<g clip-path="url(#frame)"><rect width="1200" height="388" fill="url(#surface)"/><rect width="1200" height="388" fill="url(#grid)"/><path d="M52 30L1148 30" fill="none" stroke="#E58B78" stroke-width="1.5" stroke-linecap="round" class="draw" pathLength="1"/><text x="52" y="62" class="mono enter" fill="#B7C2BD" font-size="15" font-weight="700" text-anchor="start" >CHICAGO · BUILDING IN PUBLIC</text><text x="52" y="141" class="display enter d1" fill="#F5F0E8" font-size="72" font-weight="500" text-anchor="start" >Umang Dhawan</text><text x="54" y="181" class="enter d2" fill="#F5F0E8" font-size="23" font-weight="650" text-anchor="start" >Technology consultant  ·  Open-source product builder</text><text x="54" y="221" class="enter d3" fill="#B7C2BD" font-size="20" font-weight="400" text-anchor="start" >I turn complex ideas into reliable systems that ship.</text><path d="M54 254L1146 254" fill="none" stroke="#3B4948" stroke-width="1.5" stroke-linecap="round" class="" /><text x="54" y="286" class="mono" fill="#E58B78" font-size="15" font-weight="600" text-anchor="start" >FOCUS / 01—04</text><text x="54" y="326" class="mono" fill="#E58B78" font-size="15" font-weight="600" text-anchor="start" >01</text><text x="90" y="326" class="" fill="#F5F0E8" font-size="16" font-weight="650" text-anchor="start" >PRODUCT SYSTEMS</text><text x="90" y="354" class="" fill="#B7C2BD" font-size="16" font-weight="400" text-anchor="start" >Strategy through software</text><text x="334" y="326" class="mono" fill="#99B5CB" font-size="15" font-weight="600" text-anchor="start" >02</text><text x="370" y="326" class="" fill="#F5F0E8" font-size="16" font-weight="650" text-anchor="start" >QUALITY ENGINEERING</text><text x="370" y="354" class="" fill="#B7C2BD" font-size="16" font-weight="400" text-anchor="start" >Evidence before claims</text><text x="614" y="326" class="mono" fill="#A5BBA7" font-size="15" font-weight="600" text-anchor="start" >03</text><text x="650" y="326" class="" fill="#F5F0E8" font-size