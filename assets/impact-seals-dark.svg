<g clip-path="url(#frame)"><rect width="1200" height="308" fill="url(#surface)"/><rect width="1200" height="308" fill="url(#grid)"/><text x="48" y="42" class="mono" fill="#D9B963" font-size="15" font-weight="750" text-anchor="start" >SELECTED DELIVERY IMPACT</text><text x="1152" y="42" class="mono" fill="#8291A0" font-size="14" font-weight="650" text-anchor="end" >PROFILE RECORD · 2022—NOW</text><path d="M48 63L1152 63" fill="none" stroke="#334657" stroke-width="1.5" stroke-linecap="round" class="" /><circle cx="166" cy="137" r="44" fill="#14202B" stroke="#D9B963" stroke-width="2" class="enter d0"/><circle cx="166" cy="137" r="36" fill="none" stroke="#D9B963" stroke-width="1" stroke-dasharray="3 6" opacity=".55"/><text x="166" y="147" class="display" fill="#F4EFE6" font-size="31" font-weight="600" text-anchor="middle" >100+</text><text x="166" y="214" class="mono" fill="#F4EFE6" font-size="17" font-weight="750" text-anchor="middle" >LOCATIONS</text><text x="166" y="239" class="" fill="#AEB9C6" font-size="15" font-weight="500" text-anchor="middle" >retail platform shipped</text><circle cx="456" cy="137" r="44" fill="#14202B" stroke="#D66B58" stroke-width="2" class="enter d1"/><circle cx="456" cy="137" r="36" fill="none" stroke="#D66B58" stroke-width="1" stroke-dasharray="3 6" opacity=".55"/><text x="456" y="147" class="display" fill="#F4EFE6" font-size="31" font-weight="600" text-anchor="middle" >ZERO</text><text x="456" y="214" class="mono" fill="#F4EFE6" font-size="17" font-weight="750" text-anchor="middle" >AUDIT FINDINGS</text><text x="456" y="239" class="" fill="#AEB9C6" font-size="15" font-weight="500" text-anchor="middle" >federal cloud delivery</text><circle cx="746" cy="137" r="44" fill="#14202B" stroke="#7898CC" stroke-width="2" class="enter d2"/><circle cx="746" cy="137" r="36" fill="none" stroke="#7898CC" stroke-width="1" stroke-dasharray="3 6" opacity=".55"/><text x="746" y="147" class="display" fill="#F4EFE6" font-size="38" font-weight="600" text-anchor