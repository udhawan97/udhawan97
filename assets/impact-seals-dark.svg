<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="308" viewBox="0 0 1200 308" role="img" aria-labelledby="title desc" data-family="impact-seals" data-static="false">
<title id="title">Selected delivery impact</title><desc id="desc">Four profile-record figures: a retail platform shipped to more than 100 locations, zero findings on a federal cloud audit, quality leadership across four cloud products, and delivery with teams on three continents.</desc>
<defs><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
