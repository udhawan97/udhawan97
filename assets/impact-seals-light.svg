<g clip-path="url(#frame)"><rect width="1200" height="356" fill="url(#surface)"/><rect width="1200" height="356" fill="url(#grid)"/><text x="48" y="42" class="mono" fill="#8B671A" font-size="15" font-weight="700" text-anchor="start" >SELECTED DELIVERY IMPACT</text><text x="1152" y="42" class="mono" fill="#586977" font-size="14" font-weight="500" text-anchor="end" >PROFILE RECORD · 2022—NOW</text><text x="48" y="92" class="display" fill="#1B2936" font-size="38" font-weight="400" text-anchor="start" >Experience, in practice.</text><path d="M48 119L1152 119" fill="none" stroke="#BFCAD0" stroke-width="1.5" stroke-linecap="round" class="" /><path d="M48 151L84 151" fill="none" stroke="#8B671A" stroke-width="3" stroke-linecap="round" class="draw" pathLength="1"/><text x="48" y="212" class="display" fill="#8B671A" font-size="72" font-weight="400" text-anchor="start" >100+</text><text x="48" y="280" class="" fill="#1B2936" font-size="26" font-weight="650" text-anchor="start" >Locations</text><text x="48" y="313" class="" fill="#4E6071" font-size="20" font-weight="400" text-anchor="start" >retail platform shipped</text><path d="M308 151L308 315" fill="none" stroke="#BFCAD0" stroke-width="1.5" stroke-linecap="round" class="" /><path d="M330 151L366 151" fill="none" stroke="#9E4434" stroke-width="3" stroke-linecap="round" class="draw" pathLength="1"/><text x="330" y="212" class="display" fill="#9E4434" font-size="62" font-weight="400" text-anchor="start" >ZERO</text><text x="330" y="280" class="" fill="#1B2936" font-size="26" font-weight="650" text-anchor="start" >Audit Findings</text><text x="330" y="313" class="" fill="#4E6071" font-size="20" font-weight="400" text-anchor="start" >federal cloud delivery</text><path d="M590 151L590 315" fill="none" stroke="#BFCAD0" stroke-width="1.5" stroke-linecap="round" class="" /><path d="M612 151L648 151" fill="none" stroke="#3D659F" stroke-width="3" stroke-linecap="round" class="draw" pathLength="1"/><text x="612" y="212" class="display" fill="#3D659F" font-size="72" font-weight="400" text-anchor="start" >4</text><text x="612" y="280" class="" fill="#1B2936" font-size="26" font-weight="650" text-anchor="start" >Cloud Products</text><text x="612" y="313" class="" fill="#4E6071" font-size="20" font-weight="400" text-anchor="start" >quality leadership</text><path d="M872 151L872 315" fill="none" stroke="#BFCAD0" stroke-width="1.5" stroke-linecap="round" class="" /><path d="M894 151L930 151" fill="none" stroke="#2C7477" stroke-width="3" stroke-linecap="round" class="draw" pathLength="1"/><text x="894" y="212" class="display" fill="#2C7477" font-size="72" font-weight="400" text-anchor="start" >3</text><text x="894" y="280" class="" fill="#1B2936" font-size="26" font-weight="650" text-anchor="start" >Continents</text><text x="894" y="313" class="" fill="#4E6071" font-size="20" font-weight="400" text-anchor="start" >worked with teams</text></g>
