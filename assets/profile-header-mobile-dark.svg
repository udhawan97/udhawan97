rt" >Evidence before claims</text><text x="24" y="393" class="mono" fill="#A5BBA7" font-size="13" font-weight="700" text-anchor="start" >03</text><text x="24" y="417" class="" fill="#F5F0E8" font-size="15" font-weight="750" text-anchor="start" >CLOUD</text><text x="24" y="439" class="" fill="#B7C2BD" font-size="13" font-weight="500" text-anchor="start" >Observable and resilient</text><text x="200" y="393" class="mono" fill="#CCAC72" font-size="13" font-weight="700" text-anchor="start" >04</text><text x="200" y="417" class="" fill="#F5F0E8" font-size="15" font-weight="750" text-anchor="start" >APPLIED AI</text><text x="200" y="439" class="" fill="#B7C2BD" font-size="13" font-weight="500" text-anchor="start" >Useful and bounded</text></g>
