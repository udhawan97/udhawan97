<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc" data-family="ai-spell" data-static="false">
<title id="title">AI, with guardrails</title><desc id="desc">A contained pixel-art wizard reviews a laptop and casts a spell. The accompanying line says AI can draft the spell while Umang reviews the blast radius. A note credits Layla, Umang&#x27;s Bernedoodle, called Bear.</desc>
