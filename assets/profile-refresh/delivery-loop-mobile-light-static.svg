<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">Build beyond the demo — define, build, verify, ship</title><desc id="desc">An engineering practice: define the outcome, build the workflow, verify failure modes, then ship the documentation, installers and updates. Lessons return to the next definition. This describes an approach, not a claim that every project has every release artifact.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="600" height="640" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="600" height="640" fill="url(#wash)"/><rect width="600" height="640" fill="url(#grid)"/><g letter-spacing="1.8"><text x="32" y="41" fill="#8B651A" font-size="15" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BUILD BEYOND THE DEMO</text></g><circle cx="58" cy="110" r="7" fill="#8B651A" /><path d="M58 125V201" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t0" pathLength="1"/><text x="92" y="119" fill="#202D3C" font-size="31" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Define</text><text x="92" y="151" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The outcome</text><circle cx="58" cy="222" r="7" fill="#365BA0" /><path d="M58 237V313" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t1" pathLength="1"/><text x="92" y="231" fill="#202D3C" font-size="31" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Build</text><text x="92" y="263" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The workflow</text><circle cx="58" cy="334" r="7" fill="#206E73" /><path d="M58 349V425" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><text x="92" y="343" fill="#202D3C" font-size="31" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Verify</text><text x="92" y="375" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The failure modes</text><circle cx="58" cy="446" r="7" fill="#8B651A" /><text x="92" y="455" fill="#202D3C" font-size="31" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Ship</text><text x="92" y="487" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The whole product</text><path d="M546 487V89H530M536 82L528 89L536 96" fill="none" stroke="#8B651A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><text x="32" y="592" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Let the lessons shape the next version.</text></g>
<rect x=".75" y=".75" width="598.5" height="638.5" rx="19.25" fill="none" stroke="#C5CFD7" stroke-width="1.5"/>
</svg>
