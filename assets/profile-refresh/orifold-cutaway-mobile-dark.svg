<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
<title id="title">Orifold — from mixed files to a finished document</title><desc id="desc">Conceptual illustration: mixed input files enter a local Mac document workflow and emerge as a finished document. The diagram is an editorial illustration, not an application screenshot.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#21354A"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35485B" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="600" height="580" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="600" height="580" fill="url(#wash)"/><rect width="600" height="580" fill="url(#grid)"/><g letter-spacing="1.8"><text x="32" y="40" fill="#DEC078" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">ORIFOLD / ENGINEERING NOTE</text></g><text x="32" y="89" fill="#F3EFE7" font-size="32" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">One finished document.</text><rect x="28" y="148" width="544" height="106" rx="12" fill="#172432" stroke="#35485B" /><text x="144" y="189" fill="#DEC078" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">MIXED FILES</text><text x="144" y="224" fill="#B6C3CF" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">PDFs, scans and documents</text><path d="M80 254 V276" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(60 165) scale(0.6)"><path d="M0 0H64L88 24V116H0Z" fill="#172432" stroke="#35485B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 0V24H88" fill="none" stroke="#DEC078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 43 L60 43" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 58 L46 58" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 73 L60 73" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 88 L35 88" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="28" y="276" width="544" height="106" rx="12" fill="#172432" stroke="#35485B" /><text x="144" y="317" fill="#DEC078" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">LOCAL WORKFLOW</text><text x="144" y="352" fill="#B6C3CF" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Repair, edit and protect</text><path d="M80 382 V404" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(60 293) scale(0.6)"><path d="M0 0H64L88 24V116H0Z" fill="#172432" stroke="#35485B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 0V24H88" fill="none" stroke="#DEC078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 43 L60 43" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 58 L46 58" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 73 L60 73" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 88 L35 88" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="28" y="404" width="544" height="106" rx="12" fill="#172432" stroke="#35485B" /><text x="144" y="445" fill="#DEC078" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">FINISHED ARTIFACT</text><text x="144" y="480" fill="#B6C3CF" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Keep the result on your Mac</text><g transform="translate(60 421) scale(0.6)"><path d="M0 0H64L88 24V116H0Z" fill="#172432" stroke="#35485B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 0V24H88" fill="none" stroke="#DEC078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 43 L60 43" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 58 L46 58" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 73 L60 73" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 88 L35 88" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="75" cy="99" r="18" fill="#DEC078"/><path d="M67 99L73 105L84 93" fill="none" stroke="#101923" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="32" y="556" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Conceptual workflow · not an app screenshot</text></g>
<rect x=".75" y=".75" width="598.5" height="578.5" rx="19.25" fill="none" stroke="#35485B" stroke-width="1.5"/>
