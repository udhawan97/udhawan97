<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-labelledby="title desc">
<title id="title">The systems atlas — ten products, one engineering practice</title><desc id="desc">A conceptual portfolio map. Orifold, Voyalier, FolioOrb and Golavo address workflows and decisions. Codemble, Dusori and Nindova explore learning, research and finite play. Nimanto, Vidha and PalDawn focus on evidence and deliberate boundaries. Layered sheets at the center represent the shared engineering practice, not shared application infrastructure.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#21354A"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35485B" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="360" height="780" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="360" height="780" fill="url(#wash)"/><rect width="360" height="780" fill="url(#grid)"/><g letter-spacing="1.8"><text x="20" y="36" fill="#DEC078" font-size="15" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">THE SYSTEMS ATLAS</text></g><text x="20" y="78" fill="#F3EFE7" font-size="30" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">Many problems.</text><text x="20" y="112" fill="#F3EFE7" font-size="28" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">One engineering practice.</text><g transform="translate(180 187) scale(0.49)"><g class="sheet s0"><path d="M0 20 L110 78 L0 137 L-110 78 Z" fill="#172432" stroke="#35485B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 78 L0 137 L110 78 L110 87 L0 147 L-110 87 Z" fill="#21354A" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 78 L0 37 L78 78 L0 120 Z" fill="none" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s1"><path d="M0 -11 L110 47 L0 106 L-110 47 Z" fill="#172432" stroke="#82CDD0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 47 L0 106 L110 47 L110 56 L0 116 L-110 56 Z" fill="#21354A" stroke="#82CDD0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 47 L0 6 L78 47 L0 89 Z" fill="none" stroke="#82CDD0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s2"><path d="M0 -42 L110 16 L0 75 L-110 16 Z" fill="#172432" stroke="#9EBAF0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 16 L0 75 L110 16 L110 25 L0 85 L-110 25 Z" fill="#21354A" stroke="#9EBAF0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 16 L0 -25 L78 16 L0 58 Z" fill="none" stroke="#9EBAF0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s3"><path d="M0 -73 L110 -15 L0 44 L-110 -15 Z" fill="#172432" stroke="#DEC078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 -15 L0 44 L110 -15 L110 -6 L0 54 L-110 -6 Z" fill="#21354A" stroke="#DEC078" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 -15 L0 -56 L78 -15 L0 27 Z" fill="none" stroke="#DEC078" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><path d="M-45 -14 L-10 5 L48 -26" fill="none" stroke="#DEC078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-45" cy="-14" r="4" fill="#DEC078" /><circle cx="48" cy="-26" r="4" fill="#DEC078" /><path d="M0 -93 V-71 M0 146 V164" fill="none" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/></g><path d="M180 260 L180 286" fill="none" stroke="#DEC078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><rect x="18" y="282" width="324" height="186" rx="12" fill="#172432" stroke="#35485B" /><circle cx="38" cy="312" r="4" fill="#DEC078" /><g letter-spacing="1.8"><text x="52" y="317" fill="#DEC078" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">WORKFLOWS + DECISIONS</text></g><text x="38" y="355" fill="#F3EFE7" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Orifold</text><text x="198" y="355" fill="#F3EFE7" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Voyalier</text><text x="38" y="393" fill="#F3EFE7" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">FolioOrb</text><text x="198" y="393" fill