<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
<title id="title">Golavo — from a forecast to an accountable record</title><desc id="desc">Conceptual illustration: a forecast is sealed before kickoff, then the result is observed and the track record is scored forward. No forecast probabilities or performance results are invented.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="600" height="580" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="600" height="580" fill="url(#wash)"/><rect width="600" height="580" fill="url(#grid)"/><g letter-spacing="1.8"><text x="32" y="40" fill="#206E73" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">GOLAVO / ENGINEERING NOTE</text></g><text x="32" y="89" fill="#202D3C" font-size="32" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">A forecast with a memory.</text><rect x="28" y="148" width="544" height="106" rx="12" fill="#FFFFFF" stroke="#C5CFD7" /><text x="144" y="189" fill="#206E73" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">SEAL FORECAST</text><text x="144" y="224" fill="#506173" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Before kickoff</text><path d="M80 254 V276" fill="none" stroke="#206E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="81" cy="200" r="28" fill="#EAF0F4" stroke="#206E73"/><text x="81" y="209" fill="#206E73" font-size="27" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">S</text><rect x="28" y="276" width="544" height="106" rx="12" fill="#FFFFFF" stroke="#C5CFD7" /><text x="144" y="317" fill="#206E73" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">OBSERVE RESULT</text><text x="144" y="352" fill="#506173" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">After the match</text><path d="M80 382 V404" fill="none" stroke="#206E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="81" cy="328" r="28" fill="#EAF0F4" stroke="#206E73"/><text x="81" y="337" fill="#206E73" font-size="27" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">→</text><rect x="28" y="404" width="544" height="106" rx="12" fill="#FFFFFF" stroke="#C5CFD7" /><text x="144" y="445" fill="#206E73" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">SCORE FORWARD</text><text x="144" y="480" fill="#506173" font-size="20" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Keep the track record visible</text><circle cx="81" cy="456" r="28" fill="#EAF0F4" stroke="#206E73"/><text x="81" y="465" fill="#206E73" font-size="27" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">✓</text><text x="32" y="556" fill="#506173" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Conceptual workflow · not an app screenshot</text></g>
<rect x=".75" y=".75" width="598.5" height="578.5" rx="19.25" fill="none" stroke="#C5CFD7" stroke-width="1.5"/>
</svg>
