<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">Golavo — from a forecast to an accountable record</title><desc id="desc">Conceptual illustration: a forecast is sealed before kickoff, then the result is observed and the track record is scored forward. No forecast probabilities or performance results are invented.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="360" height="560" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="360" height="560" fill="url(#wash)"/><rect width="360" height="560" fill="url(#grid)"/><g letter-spacing="1.8"><text x="20" y="34" fill="#206E73" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">GOLAVO / ENGINEERING NOTE</text></g><text x="20" y="75" fill="#202D3C" font-size="27" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">A forecast with a memory.</text><rect x="18" y="112" width="324" height="104" rx="12" fill="#FFFEFA" stroke="#C5CFD7" /><text x="101" y="151" fill="#206E73" font-size="16" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">SEAL FORECAST</text><text x="101" y="182" fill="#506173" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Before kickoff</text><path d="M61 216 V238" fill="none" stroke="#206E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="61" cy="164" r="25" fill="#EAF0F4" stroke="#206E73"/><text x="61" y="172" fill="#206E73" font-size="24" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">S</text><rect x="18" y="238" width="324" height="104" rx="12" fill="#FFFEFA" stroke="#C5CFD7" /><text x="101" y="277" fill="#206E73" font-size="16" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">OBSERVE RESULT</text><text x="101" y="308" fill="#506173" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">After the match</text><path d="M61 342 V364" fill="none" stroke="#206E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="61" cy="290" r="25" fill="#EAF0F4" stroke="#206E73"/><text x="61" y="298" fill="#206E73" font-size="24" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">→</text><rect x="18" y="364" width="324" height="104" rx="12" fill="#FFFEFA" stroke="#C5CFD7" /><text x="101" y="403" fill="#206E73" font-size="16" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">SCORE FORWARD</text><text x="101" y="434" fill="#506173" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Keep the record visible</text><circle cx="61" cy="416" r="25" fill="#EAF0F4" stroke="#206E73"/><text x="61" y="424" fill="#206E73" font-size="24" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">✓</text><text x="20" y="536" fill="#506173" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Conceptual workflow · not an app screenshot</text></g>
<rect x=".75" y=".75" width="358.5" height="558.5" rx="19.25" fill="none" stroke="#C5CFD7" stroke-width="1.5"/>
</svg>
