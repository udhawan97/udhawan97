<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>FolioOrb — app mark</title><desc>FolioOrb project icon in its composed resting frame, presented at a compact profile size.</desc><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28324a" />
      <stop offset="0.58" stop-color="#0d1220" />
      <stop offset="1" stop-color="#070a11" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd6f0" stop-opacity="0.34" />
      <stop offset="0.7" stop-color="#6fd6f0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="235" fill="url(#bg)" />
  <rect x="0" y="0" width="1024" height="1024" rx="235" fill="url(#sheen)" />
  <rect x="1" y="1" width="1022" height="1022" rx="234" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <circle cx="512" cy="512" r="300" fill="url(#glow)" />
  <g class="profile-orbit"><g transform="translate(512,512) scale(8.6) translate(-50,-50)">
    <ellipse cx="50" cy="50" rx="32" ry="16" transform="rotate(-22 50 50)" fill="none" stroke="#97acec" stroke-opacity="0.26" stroke-width="1.5" />
    <circle cx="50" cy="50" r="28" fill="none" stroke="#97acec" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="50" cy="22" r="6" fill="#6fd6f0" opacity="0.5" filter="url(#soft)" />
    <circle cx="50" cy="50" r="9" fill="#6fd6f0" opacity="0.55" filter="url(#soft)" />
    <circle cx="50" cy="22" r="4" fill="#6fd6f0" />
    <circle cx="50" cy="50" r="6" fill="#6fd6f0" />
  </g>
</g><style>.profile-orbit {transform-origin:512px 512px;animation:profile-orbit 12s linear infinite}@keyframes profile-orbit {to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><style>* { animation: none !important; transition: none !important; }</style></svg>
