<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="356" viewBox="0 0 1120 356" role="img" aria-labelledby="title desc">
<title id="title">Build beyond the demo — define, build, verify, ship</title><desc id="desc">An engineering practice: define the outcome, build the workflow, verify failure modes, then ship the documentation, installers and updates. Lessons return to the next definition. This describes an approach, not a claim that every project has every release artifact.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="1120" height="356" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="1120" height="356" fill="url(#wash)"/><rect width="1120" height="356" fill="url(#grid)"/><g letter-spacing="1.8"><text x="40" y="38" fill="#8B651A" font-size="15" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BUILD BEYOND THE DEMO</text></g><text x="40" y="84" fill="#202D3C" font-size="38" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">From intent to release.</text><path d="M166 142H952" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M166 142H952" fill="none" stroke="#8B651A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1" data-connector="forward"/><path d="M974 142H1062Q1082 142 1082 162V258Q1082 278 1062 278H58Q38 278 38 258V162Q38 142 58 142H138" fill="none" stroke="#8B651A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1" data-connector="return"/><path d="M130 137L138 142L130 147" fill="none" stroke="#8B651A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="166" cy="142" r="22" fill="#FFFEFA" /><circle cx="166" cy="142" r="22" fill="none" stroke="#8B651A" stroke-width="1.5"/><text x="166" y="149" fill="#8B651A" font-size="20" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">1</text><text x="166" y="208" fill="#202D3C" font-size="32" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Define</text><text x="166" y="241" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">The outcome</text><circle cx="428" cy="142" r="22" fill="#FFFEFA" /><circle cx="428" cy="142" r="22" fill="none" stroke="#365BA0" stroke-width="1.5"/><text x="428" y="149" fill="#365BA0" font-size="20" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">2</text><text x="428" y="208" fill="#202D3C" font-size="32" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Build</text><text x="428" y="241" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">The workflow</text><circle cx="690" cy="142" r="22" fill="#FFFEFA" /><circle cx="690" cy="142" r="22" fill="none" stroke="#206E73" stroke-width="1.5"/><text x="690" y="149" fill="#206E73" font-size="20" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">3</text><text x="690" y="208" fill="#202D3C" font-size="32" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Verify</text><text x="690" y="241" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">The failure modes</text><circle cx="952" cy="142" r="22" fill="#FFFEFA" /><circle cx="952" cy="142" r="22" fill="none" stroke="#8B651A" stroke-width="1.5"/><text x="952" y="149" fill="#8B651A" font-size="20" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">4</text><text x="952" y="208" fill="#202D3C" font-size="32" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Ship</text><text x="952" y="241" fill="#506173" font-size="22" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">The whole product</text><text x="560" y="323" fill="#506173" font-size="21" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Lessons shape the next version.</text></g>
