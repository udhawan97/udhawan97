<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">Build beyond the demo — define, build, verify, ship</title><desc id="desc">An engineering practice: define the outcome, build the workflow, verify failure modes, then ship the documentation, installers and updates. Lessons return to the next definition. This describes an approach, not a claim that every project has every release artifact.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#21354A"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35485B" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
.trace{animation:route 2.8s ease-out both}.trace.t1{animation-delay:.35s}.trace.t2{animation-delay:.65s}
.sheet{animation:assemble 1.6s ease-out both}.s1{animation-delay:.2s}.s2{animation-delay:.4s}.s3{animation-delay:.6s}
.endpoint{animation:settle 1.2s ease-out 2.2s both}
@media(prefers-reduced-motion:reduce){.trace,.sheet,.endpoint{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
</style><clipPath id="frame"><rect width="360" height="560" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="360" height="560" fill="url(#wash)"/><rect width="360" height="560" fill="url(#grid)"/><g letter-spacing="1.8"><text x="20" y="36" fill="#DEC078" font-size="15" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BUILD BEYOND THE DEMO</text></g><circle cx="38" cy="96" r="6" fill="#DEC078" /><path d="M38 110V180" fill="none" stroke="#35485B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t0" pathLength="1"/><text x="65" y="104" fill="#F3EFE7" font-size="26" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Define</text><text x="65" y="131" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The outcome</text><circle cx="38" cy="197" r="6" fill="#9EBAF0" /><path d="M38 211V281" fill="none" stroke="#35485B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t1" pathLength="1"/><text x="65" y="205" fill="#F3EFE7" font-size="26" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Build</text><text x="65" y="232" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The workflow</text><circle cx="38" cy="298" r="6" fill="#82CDD0" /><path d="M38 312V382" fill="none" stroke="#35485B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><text x="65" y="306" fill="#F3EFE7" font-size="26" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Verify</text><text x="65" y="333" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The failure modes</text><circle cx="38" cy="399" r="6" fill="#DEC078" /><text x="65" y="407" fill="#F3EFE7" font-size="26" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Ship</text><text x="65" y="434" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The whole product</text><path d="M330 416V83H317M324 77L317 83L324 89" fill="none" stroke="#DEC078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><path d="M20 500 L340 500" fill="none" stroke="#35485B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="532" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Lessons shape the next version.</text></g>
<rect x=".75" y=".75" width="358.5" height="558.5" rx="19.25" fill="none" stroke="#35485B" stroke-width="1.5"/>
</svg>
