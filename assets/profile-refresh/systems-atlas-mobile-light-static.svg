<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1010" viewBox="0 0 600 1010" role="img" aria-labelledby="title desc">
<title id="title">The systems atlas — ten products, one engineering practice</title><desc id="desc">A conceptual portfolio map. Orifold, Voyalier, FolioOrb and Golavo address workflows and decisions. Codemble, Dusori and Nindova explore learning, research and finite play. Nimanto, Vidha and PalDawn focus on evidence and deliberate boundaries. Layered sheets at the center represent the shared engineering practice, not shared application infrastructure.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="600" height="1010" rx="20"/></clipPath></defs>
