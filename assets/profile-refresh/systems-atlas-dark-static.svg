<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">The systems atlas — ten products, one engineering practice</title><desc id="desc">A conceptual portfolio map. Orifold, Voyalier, FolioOrb and Golavo address workflows and decisions. Codemble, Dusori and Nindova explore learning, research and finite play. Nimanto, Vidha and PalDawn focus on evidence and deliberate boundaries. Layered sheets at the center represent the shared engineering practice, not shared application infrastructure.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#21354A"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35485B" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="1120" height="620" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="1120" height="620" fill="url(#wash)"/><rect width="1120" height="620" fill="url(#grid)"/><g letter-spacing="1.8"><text x="40" y="43" fill="#DEC078" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">THE SYSTEMS ATLAS</text></g><text x="40" y="92" fill="#F3EFE7" font-size="39" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">Many problems. One engineering practice.</text><text x="40" y="126" fill="#B6C3CF" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Ten products, connected by the care between an idea and a useful artifact.</text><path d="M334 326 H388 Q408 326 428 311 L455 296" fill="none" stroke="#DEC078" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><path d="M642 289 L672 272 Q694 260 714 260 H757" fill="none" stroke="#9EBAF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace t1" pathLength="1"/><path d="M642 352 L680 386 Q699 407 720 407 H757" fill="none" stroke="#82CDD0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><g transform="translate(550 290) scale(1.03)"><g class="sheet s0"><path d="M0 20 L110 78 L0 137 L-110 78 Z" fill="#172432" stroke="#35485B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 78 L0 137 L110 78 L110 87 L0 147 L-110 87 Z" fill="#21354A" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 78 L0 37 L78 78 L0 120 Z" fill="none" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s1"><path d="M0 -11 L110 47 L0 106 L-110 47 Z" fill="#172432" stroke="#82CDD0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 47 L0 106 L110 47 L110 56 L0 116 L-110 56 Z" fill="#21354A" stroke="#82CDD0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 47 L0 6 L78 47 L0 89 Z" fill="none" stroke="#82CDD0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s2"><path d="M0 -42 L110 16 L0 75 L-110 16 Z" fill="#172432" stroke="#9EBAF0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 16 L0 75 L110 16 L110 25 L0 85 L-110 25 Z" fill="#21354A" stroke="#9EBAF0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 16 L0 -25 L78 16 L0 58 Z" fill="none" stroke="#9EBAF0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><g class="sheet s3"><path d="M0 -73 L110 -15 L0 44 L-110 -15 Z" fill="#172432" stroke="#DEC078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-110 -15 L0 44 L110 -15 L110 -6 L0 54 L-110 -6 Z" fill="#21354A" stroke="#DEC078" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-78 -15 L0 -56 L78 -15 L0 27 Z" fill="none" stroke="#DEC078" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/></g><path d="M-45 -14 L-10 5 L48 -26" fill="none" stroke="#DEC078" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-45" cy="-14" r="4" fill="#DEC078" /><circle cx="48" cy="-26" r="4" fill="#DEC078" /><path d="M0 -93 V-71 M0 146 V164" fill="none" stroke="#35485B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/></g><text x="550" y="494" fill="#F3EFE7" font-size="26" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="middle">Beyond the demo.</text><text x="550" y="525" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Reasoning. Failure modes. Ownership.</text><rect x="40" y="178" width="294" height="334" rx="12" fill="#172432" stroke="#35485B" /><g letter-spacing="1.8"><text x="60" y="212" fill="#DEC078" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">WORKFLOWS + DECISIONS</text></g><circle cx="61" cy="245" r="3" fill="#DEC078" /><text x="76" y="251" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Orifold</text><text x="76" y="274" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Finish the document</text><circle cx="61" cy="311" r="3" fill="#DEC078" /><text x="76" y="317" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Voyalier</text><text x="76" y="340" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Prepare the departure</text><circle cx="61" cy="377" r="3" fill="#DEC078" /><text x="76" y="383" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">FolioOrb</text><text x="76" y="406" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Explain the portfolio</text><circle cx="61" cy="443" r="3" fill="#DEC078" /><text x="76" y="449" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Golavo</text><text x="76" y="472" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Account for the forecast</text><rect x="757" y="178" width="323" height="167" rx="12" fill="#172432" stroke="#35485B" /><g letter-spacing="1.8"><text x="778" y="212" fill="#9EBAF0" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">LEARNING + EXPLORATION</text></g><text x="778" y="249" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Codemble · Dusori</text><text x="778" y="282" fill="#F3EFE7" font-size="23" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Nindova</text><text x="778" y="320" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Codebases · research · finite play</text><rect x="757" y="367" width="323" height="145" rx="12" fill="#172432" stroke="#35485B" /><g letter-spacing="1.8"><text x="778" y="401" fill="#82CDD0" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">EVIDENCE + BOUNDARIES</text></g><text x="778" y="438" fill="#F3EFE7" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Nimanto · Vidha · PalDawn</text><text x="778" y="478" fill="#B6C3CF" font-size="16" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Matching · rehearsal · learning</text><path d="M40 563 L1080 563" fill="none" stroke="#35485B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><g letter-spacing="1.8"><text x="40" y="593" fill="#B6C3CF" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">INDEPENDENT PRODUCTS. A CONSISTENT STANDARD OF CARE.</text></g><text x="1080" y="593" fill="#DEC078" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="end">Explore below ↓</text></g>
