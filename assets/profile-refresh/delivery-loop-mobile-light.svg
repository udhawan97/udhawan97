<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc">
<title id="title">Build beyond the demo — define, build, verify, ship</title><desc id="desc">An engineering practice: define the outcome, build the workflow, verify failure modes, then ship the documentation, installers and updates. Lessons return to the next definition. This describes an approach, not a claim that every project has every release artifact.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
.trace{animation:route 2.8s ease-out both}.trace.t1{animation-delay:.35s}.trace.t2{animation-delay:.65s}
.sheet{animation:assemble 1.6s ease-out both}.s1{animation-delay:.2s}.s2{animation-delay:.4s}.s3{animation-delay:.6s}
.endpoint{animation:settle 1.2s ease-out 2.2s both}
@media(prefers-reduced-motion:reduce){.trace,.sheet,.endpoint{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
</style><clipPath id="frame"><rect width="360" height="600" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="360" height="600" fill="url(#wash)"/><rect width="360" height="600" fill="url(#grid)"/><g letter-spacing="1.8"><text x="24" y="36" fill="#8B651A" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BUILD BEYOND THE DEMO</text></g><text x="24" y="78" fill="#202D3C" font-size="28" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">From intent to release.</text><path d="M42 450V482Q42 498 58 498H312Q328 498 328 482V118Q328 102 312 102H58Q42 102 42 118V126" fill="none" stroke="#8B651A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1" data-connector="return"/><path d="M37 119L42 126L47 119" fill="none" stroke="#8B651A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 166V226" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1" data-connector="forward"/><circle cx="42" cy="146" r="19" fill="#FFFEFA" /><text x="42" y="152" fill="#8B651A" font-size="18" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">1</text><text x="78" y="152" fill="#202D3C" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Define</text><text x="78" y="180" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The outcome</text><path d="M42 266V326" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1" data-connector="forward"/><circle cx="42" cy="246" r="19" fill="#FFFEFA" /><text x="42" y="252" fill="#365BA0" font-size="18" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">2</text><text x="78" y="252" fill="#202D3C" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Build</text><text x="78" y="280" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The workflow</text><path d="M42 366V426" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1" data-connector="forward"/><circle cx="42" cy="346" r="19" fill="#FFFEFA" /><text x="42" y="352" fill="#206E73" font-size="18" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">3</text><text x="78" y="352" fill="#202D3C" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Verify</text><text x="78" y="380" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The failure modes</text><circle cx="42" cy="446" r="19" fill="#FFFEFA" /><text x="42" y="452" fill="#8B651A" font-size="18" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">4</text><text x="78" y="452" fill="#202D3C" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Ship</text><text x="78" y="480" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The whole product</text><text x="24" y="543" fill="#202D3C" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Lessons shape</text><text x="24" y="570" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">the next version.</text></g>
<rect x=".75" y=".75" width="358.5" height="598.5" rx="19.25" fill="none" stroke="#C5CFD7" stroke-width="1.5"/>
</svg>
