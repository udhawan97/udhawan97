<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">Build beyond the demo — define, build, verify, ship</title><desc id="desc">An engineering practice: define the outcome, build the workflow, verify failure modes, then ship the documentation, installers and updates. Lessons return to the next definition. This describes an approach, not a claim that every project has every release artifact.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF8F2"/><stop offset="1" stop-color="#EAF0F4"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C5CFD7" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
.trace{animation:route 2.8s ease-out both}.trace.t1{animation-delay:.35s}.trace.t2{animation-delay:.65s}
.sheet{animation:assemble 1.6s ease-out both}.s1{animation-delay:.2s}.s2{animation-delay:.4s}.s3{animation-delay:.6s}
.endpoint{animation:settle 1.2s ease-out 2.2s both}
@media(prefers-reduced-motion:reduce){.trace,.sheet,.endpoint{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
</style><clipPath id="frame"><rect width="1120" height="250" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="1120" height="250" fill="url(#wash)"/><rect width="1120" height="250" fill="url(#grid)"/><g letter-spacing="1.8"><text x="40" y="41" fill="#8B651A" font-size="15" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BUILD BEYOND THE DEMO</text></g><path d="M57 106H861" fill="none" stroke="#C5CFD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 106H861" fill="none" stroke="#8B651A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><circle cx="56" cy="106" r="6" fill="#8B651A" class="endpoint"/><text x="56" y="153" fill="#202D3C" font-size="27" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Define</text><text x="56" y="182" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The outcome</text><circle cx="326" cy="106" r="6" fill="#365BA0" class="endpoint"/><text x="326" y="153" fill="#202D3C" font-size="27" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Build</text><text x="326" y="182" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The workflow</text><circle cx="596" cy="106" r="6" fill="#206E73" class="endpoint"/><text x="596" y="153" fill="#202D3C" font-size="27" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Verify</text><text x="596" y="182" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The failure modes</text><circle cx="866" cy="106" r="6" fill="#8B651A" class="endpoint"/><text x="866" y="153" fill="#202D3C" font-size="27" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Ship</text><text x="866" y="182" fill="#506173" font-size="19" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">The whole product</text><path d="M1006 160V216H55V201M49 207L55 201L61 207" fill="none" stroke="#C5CFD7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1"/><text x="540" y="239" fill="#506173" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">Lessons return to the next version.</text></g>
<rect x=".75" y=".75" width="1118.5" height="248.5" rx="19.25" fill="none" stroke="#C5CFD7" stroke-width="1.5"/>
</svg>
