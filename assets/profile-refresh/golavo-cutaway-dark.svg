<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">Golavo — from a forecast to an accountable record</title><desc id="desc">Conceptual illustration: a forecast is sealed before kickoff, then the result is observed and the track record is scored forward. No forecast probabilities or performance results are invented.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#21354A"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35485B" stroke-width=".6" opacity=".28"/></pattern><style>text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
</style><clipPath id="frame"><rect width="1120" height="320" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="1120" height="320" fill="url(#wash)"/><rect width="1120" height="320" fill="url(#grid)"/><g letter-spacing="1.8"><text x="40" y="40" fill="#82CDD0" font-size="14" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">GOLAVO / ENGINEERING NOTE</text></g><text x="40" y="89" fill="#F3EFE7" font-size="37" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">A forecast with a memory.</text><rect x="48" y="129" width="264" height="130" rx="12" fill="#172432" stroke="#35485B" /><rect x="428" y="129" width="264" height="130" rx="12" fill="#172432" stroke="#35485B" /><rect x="808" y="129" width="264" height="130" rx="12" fill="#172432" stroke="#35485B" /><path d="M324 194H414M404 187L414 194L404 201" fill="none" stroke="#82CDD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M704 194H794M784 187L794 194L784 201" fill="none" stroke="#82CDD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="95" cy="186" r="22" fill="#21354A" stroke="#82CDD0" stroke-width="1.5"/><path d="M86 184V178A9 9 0 0 1 104 178V184M83 184H107V202H83Z" fill="none" stroke="#82CDD0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="182" fill="#F3EFE7" font-size="25" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Sealed</text><text x="134" y="213" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Before kickoff</text><circle cx="475" cy="186" r="22" fill="#21354A" stroke="#82CDD0" stroke-width="1.5"/><path d="M462 186Q475 168 488 186Q475 204 462 186Z" fill="none" stroke="#82CDD0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="475" cy="186" r="4" fill="#82CDD0" /><text x="514" y="182" fill="#F3EFE7" font-size="25" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Observed</text><text x="514" y="213" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">After the match</text><circle cx="855" cy="186" r="22" fill="#21354A" stroke="#82CDD0" stroke-width="1.5"/><path d="M844 187L853 195L867 177" fill="none" stroke="#82CDD0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="894" y="182" fill="#F3EFE7" font-size="25" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Scored</text><text x="894" y="213" fill="#B6C3CF" font-size="17" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Forward record</text><g letter-spacing="1.8"><text x="48" y="291" fill="#82CDD0" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">SEAL FORECAST</text></g><g letter-spacing="1.8"><text x="428" y="291" fill="#82CDD0" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">OBSERVE RESULT</text></g><g letter-spacing="1.8"><text x="808" y="291" fill="#82CDD0" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">SCORE FORWARD</text></g></g>
<rect x=".75" y=".75" width="1118.5" height="318.5" rx="19.25" fill="none" stroke="#35485B" stroke-width="1.5"/>
</svg>
