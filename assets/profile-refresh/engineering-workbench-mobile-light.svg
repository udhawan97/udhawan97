<svg xmlns="http://www.w3.org/2000/svg" width="360" height="752" viewBox="0 0 360 752" role="img" aria-labelledby="title desc">
<title id="title">The engineering workbench — different tools, deliberate choices</title><desc id="desc">A tool palette: Swift and PDFKit; Rust and Tauri; Python, FastAPI and SQLite; TypeScript and Astro. GitHub Actions, AWS and Azure support delivery and cloud work. Original document, chassis, graph and browser-window illustrations represent tool categories, not shared application infrastructure.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F5EF"/><stop offset="1" stop-color="#EDEEE8"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C8CDC5" stroke-width=".6" opacity=".28"/></pattern><style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Atelier · enrichment: hand-built SVG · nav: N6 · footer: Ft2 */
text{font-kerning:normal}.trace{stroke-dasharray:1;stroke-dashoffset:0}.sheet{transform:translateY(0)}
@keyframes route{from{stroke-dashoffset:1;opacity:.12}to{stroke-dashoffset:0;opacity:1}}
@keyframes assemble{from{transform:translateY(9px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes settle{from{opacity:.3}to{opacity:1}}
.trace{animation:route 2.8s ease-out both}.trace.t1{animation-delay:.35s}.trace.t2{animation-delay:.65s}
.sheet{animation:assemble 1.6s ease-out both}.s1{animation-delay:.2s}.s2{animation-delay:.4s}.s3{animation-delay:.6s}
.endpoint{animation:settle 1.2s ease-out 2.2s both}
@media(prefers-reduced-motion:reduce){.trace,.sheet,.endpoint{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}

@keyframes enso-draw{0%,8%{stroke-dashoffset:1;opacity:.15}55%,82%{stroke-dashoffset:0;opacity:.6}100%{stroke-dashoffset:-1;opacity:.15}}
.enso-stroke{stroke-dasharray:1;animation:enso-draw 12s ease-in-out infinite}
@keyframes atlas-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes orbit-turn{to{transform:rotate(360deg)}}
@keyframes signal-run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ink-write{0%,12%{stroke-dashoffset:1;opacity:.2}60%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.2}}
@keyframes node-light{0%,70%,100%{opacity:.25}25%,45%{opacity:1}}
@keyframes cursor-blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.atlas-plane{animation:atlas-float 6s ease-in-out infinite}
.atlas-plane.p1{animation-delay:-2s}.atlas-plane.p2{animation-delay:-4s}
.atlas-orbit{animation:orbit-turn 18s linear infinite;transform-origin:0px 0px}
.atlas-signal,.bench-signal{stroke-dasharray:7 93;animation:signal-run 4.5s linear infinite}
.atlas-signal.p1{animation-delay:-1.5s}.atlas-signal.p2{animation-delay:-3s}
.bench-rotor{animation:orbit-turn 12s linear infinite;transform-origin:55px 48px}
.bench-ink{stroke-dasharray:1;animation:ink-write 6s ease-in-out infinite}
.bench-node{animation:node-light 4s ease-in-out infinite}
.bench-node.n1{animation-delay:.6s}.bench-node.n2{animation-delay:1.2s}.bench-node.n3{animation-delay:1.8s}.bench-node.n4{animation-delay:2.4s}
.bench-cursor{animation:cursor-blink 1.2s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.enso-stroke,.atlas-plane,.atlas-orbit,.atlas-signal,.bench-rotor,.bench-ink,.bench-node,.bench-cursor,.bench-signal{animation:none!important;transform:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style><clipPath id="frame"><rect width="360" height="752" rx="20"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="360" height="752" fill="url(#wash)"/><rect width="360" height="752" fill="url(#grid)"/><g letter-spacing="1.8"><text x="24" y="37" fill="#994535" font-size="13" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">THE ENGINEERING WORKBENCH</text></g><text x="24" y="85" fill="#20292B" font-size="32" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">Different tools.</text><text x="24" y="130" fill="#20292B" font-size="31" font-weight="400" font-family="Georgia,'Times New Roman',serif" text-anchor="start">Deliberate choices.</text><rect x="24" y="166" width="144" height="202" rx="14" fill="#FFFEFA" stroke="#C8CDC5" /><g aria-hidden="true" transform="translate(46 181) scale(0.9)"><ellipse cx="55" cy="101" rx="48" ry="8" fill="#F7F5EF" opacity=".6"/><path d="M24 6H65L86 27V89H24ZM65 6V27H86M37 42H71M37 55H65M37 68H57" fill="none" stroke="#994535" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><path d="M37 42H71M37 55H65M37 68H57" fill="none" stroke="#20292B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="bench-ink" pathLength="1"/></g><text x="38" y="310" fill="#20292B" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Swift</text><text x="38" y="343" fill="#53615E" font-size="18" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">PDFKit</text><rect x="192" y="166" width="144" height="202" rx="14" fill="#FFFEFA" stroke="#C8CDC5" /><g aria-hidden="true" transform="translate(214 181) scale(0.9)"><ellipse cx="55" cy="101" rx="48" ry="8" fill="#F7F5EF" opacity=".6"/><path d="M55 8L89 28V68L55 88L21 68V28ZM55 28L72 38V58L55 68L38 58V38ZM55 0V8M55 88V96M13 24L21 28M89 68L97 72M13 72L21 68M89 28L97 24" fill="none" stroke="#3F627A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="bench-rotor"/></g><text x="206" y="310" fill="#20292B" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Rust</text><text x="206" y="343" fill="#53615E" font-size="18" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Tauri</text><rect x="24" y="396" width="144" height="202" rx="14" fill="#FFFEFA" stroke="#C8CDC5" /><g aria-hidden="true" transform="translate(46 411) scale(0.9)"><ellipse cx="55" cy="101" rx="48" ry="8" fill="#F7F5EF" opacity=".6"/><path d="M23 23H55V49H88M23 75H55V49M55 49V13M23 23V75" fill="none" stroke="#4B6956" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><circle cx="23" cy="23" r="7" fill="#4B6956" class="bench-node n0"/><circle cx="23" cy="23" r="7" fill="none" stroke="#4B6956" stroke-width="2"/><circle cx="23" cy="75" r="7" fill="#4B6956" class="bench-node n1"/><circle cx="23" cy="75" r="7" fill="none" stroke="#4B6956" stroke-width="2"/><circle cx="55" cy="49" r="7" fill="#4B6956" class="bench-node n2"/><circle cx="55" cy="49" r="7" fill="none" stroke="#4B6956" stroke-width="2"/><circle cx="88" cy="49" r="7" fill="#4B6956" class="bench-node n3"/><circle cx="88" cy="49" r="7" fill="none" stroke="#4B6956" stroke-width="2"/><circle cx="55" cy="13" r="7" fill="#4B6956" class="bench-node n4"/><circle cx="55" cy="13" r="7" fill="none" stroke="#4B6956" stroke-width="2"/></g><text x="38" y="540" fill="#20292B" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Python</text><text x="38" y="573" fill="#53615E" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">FastAPI · SQLite</text><rect x="192" y="396" width="144" height="202" rx="14" fill="#FFFEFA" stroke="#C8CDC5" /><g aria-hidden="true" transform="translate(214 411) scale(0.9)"><ellipse cx="55" cy="101" rx="48" ry="8" fill="#F7F5EF" opacity=".6"/><path d="M12 13H98V83H12ZM12 31H98M24 22H25M33 22H34M42 22H43M38 47L27 57L38 67M71 47L82 57L71 67M60 43L50 71" fill="none" stroke="#994535" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="trace" pathLength="1"/><path d="M76 74H88" fill="none" stroke="#20292B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="bench-cursor"/></g><text x="206" y="540" fill="#20292B" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">TypeScript</text><text x="206" y="573" fill="#53615E" font-size="18" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Astro</text><path d="M96 616V640H264V616M180 640V662" fill="none" stroke="#C8CDC5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="trace t2" pathLength="1" data-connector="bench"/><path d="M96 616V640H264V616" fill="none" stroke="#994535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="bench-signal" pathLength="100"/><text x="24" y="695" fill="#20292B" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">Delivery &amp; cloud</text><text x="24" y="726" fill="#53615E" font-size="18" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="start">GitHub Actions · AWS · Azure</text></g>
