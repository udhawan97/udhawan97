name: Profile validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
          command -v rsvg-convert
      - name: Validate profile assets
        run: python3 design/readme-refresh/validate_assets.py
      - name: Check generated files and whitespace
        run: |
          git diff --exit-code -- assets design/readme-refresh/*manifest.json
          git diff-tree --check HEAD
