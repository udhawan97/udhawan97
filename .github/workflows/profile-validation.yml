name: Profile validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
          command -v rsvg-convert
      - name: Validate profile assets
        run: python3 design/readme-refresh/validate_assets.py
      - name: Check generated files and whitespace
        run: |
          git diff --exit-code -- assets design/readme-refresh/*manifest.json
          git diff-tree --check HEAD
